name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 必要的 Pages 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署（只保留最后一次）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 Node 20 LTS（GitHub runner 原生预安装，不依赖 setup-node 下载，避免网络失败）
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build with Vite
        # vite.config.ts 会自动读取 GITHUB_REPOSITORY 设置 base 路径（如 /mason/）
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
